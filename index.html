/* ============================================================
   STATE
   ============================================================ */
const LS="wtb.state.v1";
let S=null, pinned=null;
/* A pin is a meeting, not an instant: it starts pinMin minutes into the pinned
   column and runs pinLen minutes. One hour from :00 is the default, and the
   default is the one thing links leave out -- so a link written before these
   existed still means exactly what it did. */
let pinMin=0, pinLen=60;
/* Chosen as start + stop, stored as start + length. The stop quarter sets
   the minute the meeting ends on; -1h / +1h move that end by whole hours.
   Length stays the stored quantity because everything downstream wants it:
   the working-hours test, the link, the calendar file. Quarter hours, from
   15 min up to 256 h: the link keeps two characters (10 bits, 1024 quarter
   hours) for a length, and +1h greys out at the top. Something genuinely
   multi-day -- a hotel stay -- wants a start date and an end date, not a
   stack of +1h presses, so there is no point encoding more. */
const LEN_MIN=15, LEN_MAX=1024*15;
const LEN_CODE=[60,30,90,120,180,240];     // link: the old presets keep their codes
function clampLen(l){ while(l<LEN_MIN) l+=60; while(l>LEN_MAX) l-=60; return l; }
function stopMin(){ return (pinMin+pinLen)%60; }
function lenWords(m){                       // "1 h 15 min", "1 d 1 h", "10 d 16 h"
  const d=Math.floor(m/1440), h=Math.floor(m%1440/60), r=m%60;
  return [d?d+" d":"",h?h+" h":"",r?r+" min":""].filter(Boolean).join(" ");
}
/* Calendar days a meeting runs past its start day, in one zone's own clock.
   Counted on the last minute, so a meeting ending exactly at midnight stays
   on its own day, the way a calendar shows 11 PM-12 AM. */
function spillDays(t0,t1,tz){
  const a=wall(t0,tz), b=wall(t1-60000,tz);
  return Math.round((Date.UTC(b.y,b.mo-1,b.d)-Date.UTC(a.y,a.mo-1,a.d))/86400000);
}
/* Start keeps the end where it is, so picking a start never moves the stop
   you picked. Only when the end would fall before the start (or past the
   ceiling) does it shift by an hour. */
function setStart(v){ pinLen=clampLen(pinMin+pinLen-v); pinMin=v; }
/* Stop moves the end to the nearest time with that minute -- never more than
   half an hour -- and an exact tie stays in the end's own clock hour, so from
   9:00-10:00, ":45" gives 9:45 and ":30" gives 10:30. */
function setStop(v){
  const e=pinMin+pinLen, base=Math.floor(e/60)*60;
  let ne=base+v;
  for(const c of [base-60+v,base+60+v]) if(Math.abs(c-e)<Math.abs(ne-e)) ne=c;
  pinLen=clampLen(ne-pinMin);
}
function nudgeLen(d){ const l=pinLen+d; if(l>=LEN_MIN&&l<=LEN_MAX) pinLen=l; }
/* The last rendered meeting, for handlers that act on it (calendar, share). */
let pinSpan=null;
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function dayWords(dt){
  return WD[new Date(Date.UTC(dt.y,dt.mo-1,dt.d)).getUTCDay()]+" "+dt.d+" "+titleMon(dt.mo);
}

/* ---------- calendar file ----------
   RFC 5545, built in the page and handed over as a download; no service is
   involved. Times are written in UTC (the trailing Z), which every calendar
   converts to its own zone, so no VTIMEZONE block is needed. */
function icsText(t0,t1,summary,desc,url){
  const tx=v=>String(v).replace(/\\/g,"\\\\").replace(/;/g,"\\;")
    .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const st=t=>new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//World Time Tool//EN",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:"+st(t0)+"-"+Math.random().toString(36).slice(2,10)+"@world-time-tool",
    "DTSTAMP:"+st(Date.now()),"DTSTART:"+st(t0),"DTEND:"+st(t1),
    "SUMMARY:"+tx(summary),"DESCRIPTION:"+tx(desc)];
  if(url) L.push("URL:"+url);
  L.push("END:VEVENT","END:VCALENDAR");
  return L.map(foldIcs).join("\r\n")+"\r\n";
}
/* Lines over 75 octets fold onto CRLF plus a space. Octets, not characters:
   the en dash in a time range is three bytes of UTF-8. */
function foldIcs(line){
  const enc=new TextEncoder(), parts=[];
  let cur="", n=0, lim=75;
  for(const ch of line){
    const b=enc.encode(ch).length;
    if(n+b>lim){ parts.push(cur); cur=""; n=0; lim=74; }   // 74 + the leading space
    cur+=ch; n+=b;
  }
  parts.push(cur);
  return parts.join("\r\n ");
}
function downloadIcs(txt,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar;charset=utf-8"}));
  a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- native share ----------
   Phones get their own share sheet (Messages, WhatsApp, Mail). Desktops keep
   copying: navigator.share exists there too, but the OS sheet is a detour
   from the paste people actually want. */
function canShare(){
  return !!navigator.share&&(touchMode||
    (!!window.matchMedia&&matchMedia("(pointer:coarse)").matches));
}

/* ---------- DST drift ----------
   A recurring meeting stays fixed in the home clock, so where another zone
   changes its clocks on a different date the gap between them moves -- for
   three weeks in March and one in October/November between New York and
   Europe. Only worth saying when it bears on this meeting: a change during
   the pinned meeting, or in the three days before it starts or after it
   ends. A change five weeks out is not news today, and saying it on every
   pin was just noise.
   The moment is found exactly -- an hourly scan, then bisection to the
   minute -- because "within three days" has to be judged on the real instant,
   not on one sample a day. */
const DRIFT_SOON=3*86400000;
let _driftKey="", _driftVal=[];
function gapWords(m){
  const a=Math.abs(m), h=Math.floor(a/60), r=a%60;
  return r===0?h+" h":r===30?h+".5 h":h+" h "+r+" min";
}
function spanWords(d){
  return d%7===0?(d===7?"one week":d/7+" weeks"):(d===1?"one day":d+" days");
}
function durWords(ms){                       // under a day in hours, else days/weeks
  const h=Math.round(ms/3600000);
  return h<24?(h===1?"one hour":h+" hours"):spanWords(Math.round(ms/86400000));
}
function gapAt(t,tz){ return offsetAt(t,tz)-offsetAt(t,S.home); }
/* The first minute in (from, to] at which tz's gap to home differs from its
   gap at `from`, or null. Hourly steps are safe: a gap can flip back within
   hours -- Havana moves two hours before New York in March -- but no zone
   changes twice within one. */
function nextGapChange(from,to,tz){
  const g0=gapAt(from,tz);
  for(let lo=from;lo<to;){
    const hi=Math.min(lo+3600000,to);
    if(gapAt(hi,tz)!==g0){
      let a=lo, b=hi;
      while(b-a>60000){
        const m=a+Math.max(1,Math.floor((b-a)/120000))*60000;
        if(gapAt(m,tz)===g0) a=m; else b=m;
      }
      return b;
    }
    lo=hi;
  }
  return null;
}
/* A change is dated in the calendar of the zone whose clocks moved: Europe's
   autumn change is "Sun 25 Oct" to everyone, though New York is still on
   Saturday evening when it happens. */
function changeDay(c,tz){
  return dayWords(wall(c,offsetAt(c-60000,tz)!==offsetAt(c,tz)?tz:S.home));
}
/* ...and timed as people state it: New York falls back "at 2:00 AM", not at
   the 1:00 AM it becomes. */
function changeClock(c,tz){
  const w=wall(c-60000,tz); let h=w.h, mi=w.mi+1;
  if(mi===60){ mi=0; h=(h+1)%24; }
  return clockWords({h:h,mi:mi},uses24(tz));
}
/* Zones in one country do not change at one instant: each moves at 2 AM
   local, so New York and Chicago show the same time for an hour every
   November night. A flip undone within a day is only news when it lands
   inside the meeting; anywhere else it is skipped and the search goes on.
   scanGap returns the next change in (from, to] on those terms: the gap just
   before it (gb), the gap after (g1), and when it was undone if brief (r). */
function scanGap(from,to,tz,keepBrief){
  for(let f=from;;){
    const c=nextGapChange(f,to,tz);
    if(c===null) return null;
    const gb=gapAt(c-60000,tz), r=nextGapChange(c,c+86400000,tz),
          brief=r!==null&&gapAt(r,tz)===gb;
    if(brief&&!keepBrief){ f=r; continue; }
    return {c:c,gb:gb,g1:gapAt(c,tz),r:brief?r:null};
  }
}
/* At most one note per zone, the most telling first: a change during the
   meeting; else the last lasting change in the 3 days before it, which set
   the gap the meeting has (and why it differs from last week's); else the
   first lasting change in the 3 days after it. */
function driftNotes(t0,t1){
  const key=S.home+"|"+S.rows.join(",")+"|"+t0+"|"+t1;
  if(key===_driftKey) return _driftVal;
  const notes=[], home=cityOf(S.home), LOOK=56*86400000;
  const move=(a,b,past)=>Math.abs(b)<Math.abs(a)?(past?"dropped":"drops")
                                                :(past?"rose":"rises");
  for(const tz of S.rows){
    if(tz===S.home) continue;
    const head=cityOf(tz)+": gap to "+home+" ";
    let t=null;
    const d=scanGap(t0,t1,tz,true);                       // during
    if(d&&d.c<t1)
      t=head+move(d.gb,d.g1)+" to "+gapWords(d.g1)+" during the meeting, at "+
        changeClock(d.c,S.home)+" "+home+" time"+(d.r?", for "+durWords(d.r-d.c):"");
    if(!t){                                               // the 3 days before
      let last=null;
      for(let f=t0-DRIFT_SOON,q;(q=scanGap(f,t0,tz,false));f=q.c) last=q;
      if(last){
        t=head+move(last.gb,last.g1,true)+" to "+gapWords(last.g1)+" on "+changeDay(last.c,tz);
        const nx=scanGap(t0,t0+LOOK,tz,false);
        if(nx) t+=(nx.g1===last.gb?", back to ":", then ")+gapWords(nx.g1)+
                  " from "+changeDay(nx.c,tz);
      }
    }
    if(!t){                                               // the 3 days after
      const u=scanGap(t0,t1+DRIFT_SOON,tz,false);
      if(u){
        t=head+move(u.gb,u.g1)+" to "+gapWords(u.g1)+" from "+changeDay(u.c,tz);
        const fu=scanGap(u.c,u.c+LOOK,tz,false);
        if(fu) t+=fu.g1===u.gb?", for "+durWords(fu.c-u.c)
                              :", then "+gapWords(fu.g1)+" from "+changeDay(fu.c,tz);
      }
    }
    if(t) notes.push(t);
  }
  _driftKey=key; _driftVal=notes;
  return notes;
}

/* ---------- least-bad slots ----------
   When no hour has every zone inside 9-5, score each hour by how much of it
   falls outside working time across all zones, and star the best three.
   The night is graded, not flat: with 22:00-06:00 all equal, midnight for one
   person tied with a 9 PM / 6 AM split, and the stars landed on 12 AM and
   1 AM in Los Angeles for LA + Berlin + Tokyo. Graded, they land on 7 AM and
   10-11 PM there -- the slots people actually pick for that trio. Scored in
   quarter hours so :30 and :45 zones are judged on the minutes they get. */
function hourCost(t){
  if(t>=9&&t<17) return 0;
  if((t>=7&&t<9)||(t>=17&&t<19)) return 1;
  if(t>=19&&t<21) return 2;
  if((t>=6&&t<7)||(t>=21&&t<22)) return 3;
  if(t>=22||(t>=5&&t<6)) return 4;
  return 6;                               // 00:00-05:00, asleep
}
function slotCost(w){
  let c=0;
  for(let q=0;q<4;q++) c+=hourCost(((w.h*60+w.mi+q*15)%1440)/60)/4;
  return c+(w.wd==="Sat"||w.wd==="Sun"?4:0);
}

const FALLBACK_HOME="America/New_York";   // US east coast, if detection fails
const DEFAULT_ROWS=["America/Los_Angeles","Europe/Berlin","Asia/Shanghai"];

/* Machine time zone, straight from the engine. Used even when it is not in the
   Windows catalogue (aliases like America/Indiana/Indianapolis still format
   fine) -- we only fall back if the engine gives us nothing usable. */
function detectHome(){
  try{
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(tz){ wall(Date.now(),tz); return tz; }   // throws if the engine rejects it
  }catch(e){}
  return FALLBACK_HOME;
}
function todayIn(tz){ const w=wall(Date.now(),tz); return {y:w.y,mo:w.mo,d:w.d}; }

/* A hand-edited hash can carry nonsense. Date.UTC happily rolls 2026-99-99
   forward to 2034-06-06, so range-check and round-trip (this also rejects
   Feb 30) rather than trusting it. */
function validDate(y,mo,d){
  if(!(y>=1900&&y<=2200&&mo>=1&&mo<=12&&d>=1&&d<=31)) return false;
  const x=new Date(Date.UTC(y,mo-1,d));
  return x.getUTCFullYear()===y&&x.getUTCMonth()===mo-1&&x.getUTCDate()===d;
}

/* ---------- hash codec ----------
   URLSearchParams percent-encodes every "/" and "," it writes, which triples
   the length of the only interesting part of the link. A fragment may carry
   both literally (RFC 3986: fragment = *( pchar / "/" / "?" ), and "," is a
   sub-delim), so the hash is written by hand. Values are still decoded on the
   way in, which is what keeps links written by the old encoder working.

   Zones shrink further by folding the IANA area prefix to two letters. The
   map is closed -- these are every top-level area tzdb defines -- and an
   unrecognised prefix passes through verbatim, so an old link carrying a full
   "America/Denver" still reads correctly. */
const AREA={af:"Africa",am:"America",an:"Antarctica",ar:"Arctic",as:"Asia",
            at:"Atlantic",au:"Australia",eu:"Europe",in:"Indian",
            pa:"Pacific",et:"Etc",us:"US"};
const AREA_R={}; for(const k in AREA) AREA_R[AREA[k]]=k;
function zPack(z){
  const i=z.indexOf("/"), a=i<0?null:AREA_R[z.slice(0,i)];
  return a?a+"."+z.slice(i+1):z;                  // no dot in any IANA id
}
function zUnpack(s){
  const i=s.indexOf("."), a=i<0?null:AREA[s.slice(0,i)];
  return a?a+"/"+s.slice(i+1):s;
}
/* ---------- packed hash ----------
   The readable form above is still ~60 characters, most of it city names. For
   a QR code that matters twice over: fewer characters, and -- because this
   alphabet is a subset of the QR alphanumeric charset (0-9 A-Z and a few
   symbols) -- the fragment encodes at 5.5 bits per character instead of the 8
   that any lowercase letter would force.

   The whole state is bit-packed and written in base 32 over 0-9A-V. Zones are
   8-bit indices into ZONES, a frozen literal in this file, so a code means the
   same thing forever. Zones outside it (ICU knows about 3x more than the
   Windows list) are not packable and fall back to the readable form -- an
   index into the merged catalogue would differ between browsers and silently
   decode to the wrong city.

   ZONES IS APPEND-ONLY. Reordering or removing an entry breaks every link ever
   issued. selftest() checksums it so that cannot happen by accident. */
const B32="0123456789ABCDEFGHIJKLMNOPQRSTUV";
const PEPOCH=Date.UTC(2024,0,1);
const ZIDX={}; ZONES.forEach((z,i)=>{ if(ZIDX[z[1]]===undefined) ZIDX[z[1]]=i; });

/* The 32 zones people actually compare, so the common row gets a 6-bit code
   instead of 9. Rank order is what is encoded, so this list is APPEND-ONLY in
   the same way ZONES is -- except that it may not grow past 32 (5 bits).
   Membership is all that matters for correctness; the ordering within it is
   only a guess at frequency and costs nothing if it is wrong. */
const POP=["America/New_York","Europe/London","America/Los_Angeles","Europe/Berlin",
"Asia/Shanghai","Asia/Tokyo","Asia/Calcutta","America/Chicago","Europe/Paris",
"Asia/Singapore","Australia/Sydney","Asia/Dubai","Etc/UTC","America/Denver",
"Asia/Seoul","Europe/Moscow","America/Sao_Paulo","Asia/Bangkok","Europe/Warsaw",
"Europe/Bucharest","America/Mexico_City","Africa/Johannesburg","Pacific/Auckland",
"Asia/Jerusalem","Asia/Karachi","Europe/Istanbul","America/Bogota","Asia/Taipei",
"Australia/Perth","America/Buenos_Aires","Africa/Lagos","Africa/Cairo"];
const PRANK={}; POP.forEach((z,i)=>{ if(PRANK[z]===undefined) PRANK[z]=i; });

/* Layout, most-significant bit first:
     ver   2   format version (=1)
     n     4   row count - 1, so 1..16 rows
     h0    1   1 = home is row 0 (almost always), else 4 more bits of row index
     resv  2   written 0, ignored when read: the clock format is the
               viewer's own setting, so links do not carry it
     fD fP 1+1 date and pin present
     date 14   days from 2024-01-01, so 2024..2068        (only if fD)
     pin   5   column index                               (only if fP)
     rows      per row: 0 + 5 bits POP rank, or 1 + 8 bits ZONES index
     tail  2+3 meeting start (:00/:15/:30/:45) and length: a LEN_CODE index,
               or 7 then 10 bits -- two characters' worth -- of quarter
               hours for any other length, up to 256 h.
               Written only when the pin is not the default 1 h from :00
   Four popular zones with a date and a pin is 54 bits -- 11 characters.
   The tail is read leniently: past the end counts as 0, which is the
   default. So links without it decode exactly as before, and a copy of the
   page that predates it stops after the rows and still gets the pin. */
function packState(){
  const n=S.rows.length;
  if(n<1||n>16) return null;
  const t0=todayIn(S.home);
  const hasD=pinned!==null||S.date.y!==t0.y||S.date.mo!==t0.mo||S.date.d!==t0.d;
  let days=0;
  if(hasD){
    days=Math.round((Date.UTC(S.date.y,S.date.mo-1,S.date.d)-PEPOCH)/86400000);
    if(days<0||days>16383) return null;
  }
  if(pinned!==null&&(pinned<0||pinned>31)) return null;
  let b="";
  const put=(v,w)=>{ b+=v.toString(2).padStart(w,"0"); };
  put(1,2);
  put(n-1,4);
  const hi=S.rows.indexOf(S.home);
  if(hi<=0) put(1,1); else { put(0,1); put(hi,4); }
  put(0,2);                                        // the viewer's format, not the link's
  put(hasD?1:0,1); put(pinned!==null?1:0,1);
  if(hasD) put(days,14);
  if(pinned!==null) put(pinned,5);
  for(const z of S.rows){
    // either spelling packs: a row stored as Asia/Kolkata takes Calcutta's code
    const r=PRANK[z]!==undefined?PRANK[z]:PRANK[TZALIAS[z]];
    if(r!==undefined){ put(0,1); put(r,5); continue; }
    const i=ZIDX[z]!==undefined?ZIDX[z]:ZIDX[TZALIAS[z]];
    if(i===undefined) return null;          // outside the frozen table
    put(1,1); put(i,8);
  }
  if(pinned!==null&&(pinMin||pinLen!==60)){
    const li=LEN_CODE.indexOf(pinLen);
    put(pinMin/15,2);
    if(li>=0) put(li,3);                       // the presets, exactly as before
    else{ put(7,3); put(pinLen/15-1,10); }     // any other quarter-hour length
  }
  let out="";
  for(let i=0;i<b.length;i+=5) out+=B32[parseInt((b.slice(i,i+5)+"0000").slice(0,5),2)];
  return out;                               // trailing pad bits are never read
}
function unpackState(str){
  if(!/^[0-9A-V]{2,}$/.test(str)) return null;
  let b="";
  for(const ch of str) b+=B32.indexOf(ch).toString(2).padStart(5,"0");
  let p=0;
  const get=w=>{ if(p+w>b.length) throw 0; const v=parseInt(b.slice(p,p+w),2); p+=w; return v; };
  try{
    if(get(2)!==1) return null;
    const n=get(4)+1;
    const hi=get(1)?0:get(4);               // the ternary skips get(4) when h0 is set
    get(2);                                  // reserved
    const hasD=get(1), hasP=get(1);
    let date=null, pin=null;
    if(hasD){ const dt=new Date(PEPOCH+get(14)*86400000);
              date={y:dt.getUTCFullYear(),mo:dt.getUTCMonth()+1,d:dt.getUTCDate()}; }
    if(hasP) pin=get(5);
    const raw=[];
    for(let i=0;i<n;i++){
      let z;
      if(get(1)===0) z=POP[get(5)];
      else { const e=ZONES[get(8)]; z=e&&e[1]; }
      if(!z) return null;
      raw.push(z);
    }
    const home=raw[Math.min(hi,raw.length-1)];   // resolve before dedup shifts indices
    const opt=w=>p+w>b.length?0:get(w);          // the lenient tail
    const mn=opt(2)*15, li=opt(3), ln=li===7?(opt(10)+1)*15:(LEN_CODE[li]||60);
    return {home:home,rows:[...new Set(raw)],date:date||todayIn(home),pin:pin,
            pinMin:pin===null?0:mn, pinLen:pin===null?60:ln};
  }catch(e){ return null; }
}

function dPack(D){ return ""+D.y+pad(D.mo)+pad(D.d); }
function dUnpack(s){                              // 20260921, or the older 2026-09-21
  let y,mo,d;
  if(/^\d{8}$/.test(s)){ y=+s.slice(0,4); mo=+s.slice(4,6); d=+s.slice(6); }
  else{ const p=s.split("-"); if(p.length!==3) return null;
        y=+p[0]; mo=+p[1]; d=+p[2]; }
  return validDate(y,mo,d)?{y:y,mo:mo,d:d}:null;
}
/* Hand-rolled rather than URLSearchParams because that decodes "+" as a
   space, which would corrupt Etc/GMT+5. decodeURIComponent does not. */
function parseHash(h){
  const o={};
  for(const kv of h.split("&")){
    const i=kv.indexOf("=");
    if(i<1) continue;
    try{ o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); }catch(e){}
  }
  return o;
}

/* The clock format a place writes: its country's convention, per CLDR. */
function fmtFor(tz){ return zoneIs12(tz)?"12":"24"; }
/* The browser's own language/region convention: the fallback when the engine
   has no region data (Intl.Locale.getTimeZones -- Firefox, for one), where
   every zone would otherwise read as 24-hour, Americans included. */
function localeFmt(){
  try{ const h=new Intl.DateTimeFormat(undefined,{hour:"numeric"}).resolvedOptions().hourCycle;
       return h==="h11"||h==="h12"?"12":"24"; }catch(e){ return "12"; }
}
/* The default: the convention of the country this computer's time zone is in.
   Not the browser language -- US English is the usual install default rather
   than a choice, and would give am/pm to someone sitting in Zurich. */
function localFmt(){
  const f=fmtFor(detectHome());
  return H12ZONES&&H12ZONES.size?f:localeFmt();
}
/* The clock format belongs to the viewer, not to the link: what they last
   chose here, else their local default. A colleague in Germany opening your
   link sees 24-hour; you see am/pm. */
function viewerFmt(){
  try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&FMTS[s.fmt]) return s.fmt; }catch(e){}
  return localFmt();
}
function defaultState(){
  const home=detectHome();
  const rows=[home];
  for(const z of DEFAULT_ROWS) if(!rows.includes(z)) rows.push(z);
  return {home,rows,date:todayIn(home),fmt:localFmt()};
}
const FMTS={"12":1,"24":1,"mx":1};
/* Whichever form the link arrived in is the form we keep writing, so a
   hand-edited readable hash does not turn opaque the moment it is applied. */
let wantLong=false;
function loadState(){
  const h=location.hash.slice(1);
  if(h&&h.indexOf("=")<0){
    const u=unpackState(h);
    if(u){ pinned=u.pin; pinMin=u.pinMin; pinLen=u.pinLen;
           return {home:u.home,rows:u.rows,date:u.date,fmt:viewerFmt()}; }
  }
  if(h){
    wantLong=true;
    try{
      const q=parseHash(h);
      const rows=[...new Set((q.z||"").split(",").filter(Boolean).map(zUnpack))];
      if(rows.length){
        const home=q.h?zUnpack(q.h):rows[0];       // omitted when it is the first row
        const date=(q.d&&dUnpack(q.d))||todayIn(home);
        // the pin lives outside S because it is a column index, not a setting;
        // range-checking needs the column count, so render() does it
        pinned=(q.p!==undefined&&/^\d{1,3}$/.test(q.p))?+q.p:null;
        pinMin=(pinned!==null&&/^(15|30|45)$/.test(q.m||""))?+q.m:0;
        pinLen=(pinned!==null&&/^\d{2,5}$/.test(q.l||"")&&+q.l%15===0&&
                +q.l>=LEN_MIN&&+q.l<=LEN_MAX)?+q.l:60;
        return {home,rows,date,fmt:viewerFmt()};     // a t= key is ignored: the format is the viewer's
      }
    }catch(e){}
  }
  try{
    const s=JSON.parse(localStorage.getItem(LS));
    if(s&&s.rows&&s.rows.length){ s.date=todayIn(s.home); return s; }
  }catch(e){}
  return defaultState();
}
function saveState(){
  // keep home consistent with the visible rows after any mutation
  if(S.rows.length&&!S.rows.includes(S.home)) S.home=S.rows[0];
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  const packed=wantLong?null:packState();
  history.replaceState(null,"","#"+(packed||readableHash()));
}
function readableHash(){
  const P=["z="+S.rows.map(zPack).join(",")];
  if(S.home!==S.rows[0]) P.push("h="+zPack(S.home));
  /* A dateless link means "today", which is what you want from a bookmark --
     but only while nothing is pinned. A pin names one instant, so the date it
     belongs to has to travel with it or the link points at the wrong day. */
  const t0=todayIn(S.home);
  if(pinned!==null||S.date.y!==t0.y||S.date.mo!==t0.mo||S.date.d!==t0.d)
    P.push("d="+dPack(S.date));
  if(pinned!==null){
    P.push("p="+pinned);
    if(pinMin) P.push("m="+pinMin);
    if(pinLen!==60) P.push("l="+pinLen);
  }
  return P.join("&");
}

/* ============================================================
   RENDER
   ============================================================ */
/* One working-hours rule for the grid's green underline and the pinned chips,
   so the two cannot drift apart again. A slot is working time only if all of
   it fits inside 9-5: it starts at 9:00 or later and ends by 17:00. Minutes
   matter -- a +5:30 zone's 16:30 hour runs to 17:30, so it is fringe. Fringe
   means it starts no earlier than 7:00 and ends before 23:00. A grid column
   is a one-hour slot; a pinned meeting passes its own length, so a 2 h
   meeting at 16:00 is fringe even though the 16:00 column is green. */
function workBand(w,len){
  const m=w.h*60+w.mi, e=m+(len||60);
  if(m>=540&&e<=1020) return "biz";
  if(m>=420&&e<1380) return "edge";
  return "off";
}

/* Continuous hour -> colour ramp. Anchor stops are interpolated linearly, so
   fractional-offset zones (:30, :45) land between them rather than snapping.
   Deliberately low contrast: night reads as a cool hue shift, not a dark block. */
const RAMP=[
  [ 0,189,201,215],[ 4,194,206,219],[ 6,212,223,233],[ 8,237,242,241],
  [ 9,250,249,231],[12,253,252,226],[17,250,249,231],[18,236,241,241],
  [20,214,225,235],[22,195,207,220],[24,189,201,215]
];
function hourColor(h,mi){
  const t=h+(mi||0)/60;
  for(let i=1;i<RAMP.length;i++){
    const a=RAMP[i-1],b=RAMP[i];
    if(t<=b[0]){
      const f=(t-a[0])/(b[0]-a[0]);
      return "rgb("+Math.round(a[1]+(b[1]-a[1])*f)+","+
                    Math.round(a[2]+(b[2]-a[2])*f)+","+
                    Math.round(a[3]+(b[3]-a[3])*f)+")";
    }
  }
  return "rgb(189,201,215)";
}

/* Every render rebuilds #app, which threw keyboard focus back to the top of
   the page -- every 30 s from the clock refresh alone, and after any button
   that re-renders. A focused button is found again in the new DOM by its id
   or data attributes. Buttons only: refocusing an input would pop up a
   phone's keyboard or date picker. */
function focusKey(el,app){
  if(!el||el.tagName!=="BUTTON"||!app||!app.contains(el)) return null;
  const q=v=>'"'+v.replace(/["\\]/g,"\\$&")+'"';
  if(el.id) return "[id="+q(el.id)+"]";
  const a=[...el.attributes].filter(x=>x.name.indexOf("data-")===0);
  return a.length?"button"+a.map(x=>"["+x.name+"="+q(x.value)+"]").join(""):null;
}
function refocus(app,fk){
  const el=fk&&app.querySelector(fk);
  if(el&&document.activeElement!==el) el.focus({preventScroll:true});
}
function render(){
  const app=document.getElementById("app");
  const fk=focusKey(document.activeElement,app);
  const D=S.date;
  const NOW0=Date.now();          // needed by the header, before the grid maths

  // --- column axis: anchored to home-local midnight, length derived ---
  const anchor=zonedToInstant(D.y,D.mo,D.d,0,0,S.home).instant;
  const len=hoursInDay(D.y,D.mo,D.d,S.home);
  const N=Math.ceil(len);
  const instants=[]; for(let i=0;i<N;i++) instants.push(anchor+i*3600000);
  // a hand-edited p=, or a tzdata version that disagrees about the day length
  if(pinned!==null&&!(pinned>=0&&pinned<N)){ pinned=null; saveState(); }
  // clearing a pin anywhere also clears its meeting shape, so the next pin
  // starts from the default rather than inheriting a stale length
  if(pinned===null){ pinMin=0; pinLen=60; }
  // every column the meeting overlaps carries the pinned fill
  const pinCols=new Set();
  if(pinned!==null){
    const a=pinned*60+pinMin, e=a+pinLen;
    for(let i=Math.floor(a/60);i*60<e&&i<N;i++) pinCols.add(i);
  }

  // --- header ---
  const today=todayIn(S.home);
  const tabs=[];
  for(let k=-3;k<=3;k++){
    const dt=addDays(today,k);
    const sel=dt.y===D.y&&dt.mo===D.mo&&dt.d===D.d;
    const wd=wall(zonedToInstant(dt.y,dt.mo,dt.d,12,0,S.home).instant,S.home).wd;
    const we=wd==="Sat"||wd==="Sun";
    tabs.push('<div class="day'+(sel?" sel":"")+(we?" we":"")+'" data-d="'+
      dt.y+"-"+dt.mo+"-"+dt.d+'"'+(k===0?' title="Today"':"")+'>'+
      titleMon(dt.mo)+" "+dt.d+(k===0?'<i></i>':"")+'</div>');
  }
  const CLOCK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="2.1" stroke-linecap="round">'+
    '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.2 1.9"></path></svg>';
  const MAG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="2.2" stroke-linecap="round">'+
    '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>';
  // phone-sized stand-ins for the Link / Reset labels
  const I_LINK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="2.2" stroke-linecap="round">'+
    '<path d="M10.5 13.5a5 5 0 0 0 7 0l2.5-2.5a5 5 0 0 0-7-7L12 5"></path>'+
    '<path d="M13.5 10.5a5 5 0 0 0-7 0L4 13a5 5 0 0 0 7 7l1-1"></path></svg>';
  const I_RESET='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="2.2" stroke-linecap="round">'+
    '<path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"></path>'+
    '<path d="M3.5 4.5V10H9"></path></svg>';

  let html='<div class="hrow1">'+
      '<div class="brand">'+CLOCK+
        '<span class="brandtext">world<br>time<br>tool</span></div>'+
      '<div class="nowclock"><span class="nc-t" id="ncT">'+nowClockHTML()+'</span>'+
        '<span class="nc-m"><b>'+abbrOf(NOW0,S.home)+'</b> '+cityOf(S.home)+
        ' &middot; W'+(w=>isoWeek(w.y,w.mo,w.d).w)(wall(NOW0,S.home))+
        '</span></div>'+
      '<div class="search">'+MAG+
        '<input id="q" placeholder="'+(innerWidth>620?"Add a place or Windows time zone..."
          :"Add a zone")+'" autocomplete="off">'+
        '<div class="drop" id="drop"></div></div>'+
      '<div class="seg" title="Clock format. MX writes each row the way its own country does.">'+
        '<button data-fmt="12"'+(S.fmt==="12"?' class="on"':"")+'><i>am</i><i>pm</i></button>'+
        '<button data-fmt="24"'+(S.fmt==="24"?' class="on"':"")+'>24</button>'+
        '<button data-fmt="mx"'+(S.fmt==="mx"?' class="on"':"")+'>MX</button>'+
      '</div>'+
      '<button class="ui" id="copy" title="Link to this view">'+
        '<span class="t-full">Link to this view</span>'+
        '<span class="t-min">Link</span><span class="t-icon">'+I_LINK+'</span></button>'+
      /* every tier needs its own span: t-full above 1080, t-min down to 620,

      '<button class="ui" id="reset" title="Reset">'+
        '<span class="t-full">Reset</span><span class="t-min">Reset</span>'+
        '<span class="t-icon">'+I_RESET+'</span></button>'+
    '</div>'+
    '<div class="hrow2">'+
      '<button class="todaybtn" id="todaybtn"><i></i>Today</button>'+
      '<button class="ui daynav" id="dprev" title="Previous day">&#8249;</button>'+
      '<button class="ui daynav" id="dnext" title="Next day">&#8250;</button>'+
      '<div class="days">'+tabs.join("")+'</div>'+
      '<div class="spacer"></div>'+
      '<button class="wknum" id="wk" aria-haspopup="dialog" aria-expanded="'+calOn+'"'+
        ' title="ISO week of the displayed date. Click for a calendar with week numbers.">W'+
        isoWeek(D.y,D.mo,D.d).w+'</button>'+
      '<input type="date" id="dp" class="dpick" title="Jump to any date" value="'+
        D.y+"-"+pad(D.mo)+"-"+pad(D.d)+'">'+
    '</div>';

  if(!S.rows.length){ app.innerHTML=html+'<div class="empty">No zones. Add one above.</div>'; wire(); refocus(app,fk); return; }

  /* A zone can skip a calendar date outright when it crosses the date line
     (Samoa lost 2011-12-30, Kiritimati lost 1994-12-31). hoursInDay is then 0
     and the grid would render silently empty -- say so instead. */
  if(N<1){
    app.innerHTML=html+'<div class="empty">'+titleMon(D.mo)+" "+D.d+", "+D.y+
      " never happened in "+shortName(metaFor(S.home)[0])+
      " &mdash; the zone skipped this date when it crossed the date line.</div>";
    wire(); refocus(app,fk); return;
  }

  // --- precompute every cell so we can mark all-business columns ---
  const cellData=S.rows.map(tz=>instants.map(t=>wall(t,tz)));
  // a shared 9-5 window means nothing if it lands on someone's Saturday
  const allBiz=instants.map((_,i)=>cellData.every(r=>
    workBand(r[i])==="biz"&&r[i].wd!=="Sat"&&r[i].wd!=="Sun"));
  /* Only when there is no full overlap -- the green underline covers that
     case -- and only on a home weekday: at a weekend no hour is anyone's
     working time, so the stars would appear on every Saturday and mean
     nothing. Two zones at least, since one zone always has its own 9-5. */
  let best=[];
  const homeDow=new Date(Date.UTC(D.y,D.mo-1,D.d)).getUTCDay();
  if(S.rows.length>=2&&homeDow!==0&&homeDow!==6&&!allBiz.some(Boolean)){
    best=instants.map((_,i)=>({i:i,c:cellData.reduce((a,r)=>a+slotCost(r[i]),0)}))
      .sort((a,b)=>a.c-b.c||a.i-b.i).slice(0,3).map(x=>x.i).sort((a,b)=>a-b);
  }
  // one instant for every row, so clocks cannot disagree with each other
  const NOW=Date.now();
  /* The offset badge and abbreviation describe the GRID, so they must be read

     September but +16 in January; sampling "now" while showing January would
     print a badge that contradicts the cells right beside it. Mid-window is
     the representative instant. */
  const REF=anchor+Math.floor(N/2)*3600000;
  const homeOff=offsetAt(REF,S.home);
  // which column holds "now", and how far through it we are (-1 when the
  // displayed date is not today in the home zone)
  const nowExact=(NOW-anchor)/3600000;
  const nowCol=(nowExact>=0&&nowExact<N)?Math.floor(nowExact):-1;
  const nowPct=((nowExact-Math.floor(nowExact))*100).toFixed(1);
  lastN=N; lastNowCol=nowCol;

  const GT='grid-template-columns:repeat('+N+',minmax(var(--cellmin,34px),1fr))';

  // --- column ruler, in home-zone hours ---
  html+='<div class="gwrap"><div class="row hdr"><div class="lab">Place / Timezone'+
      '<i class="lgrip" title="Drag to resize &middot; double-click to reset"></i></div>'+
    '<div class="cells" style="'+GT+'">';
  const home24=uses24(S.home), rulerLab=[];
  instants.forEach((t,i)=>{
    const w=wall(t,S.home);
    const lab=home24?pad(w.h):((w.h%12===0?12:w.h%12)+(w.h<12?"a":"p"));
    rulerLab[i]=lab;
    const edge=nowCol>=N-1?" pr":(nowCol<=0?" pl":"");
    html+='<div class="hc'+(i===nowCol?" iscur":"")+(pinCols.has(i)?" pin":"")+
      '" data-col="'+i+'"'+(i===nowCol?' data-nowpct="'+nowPct+'"':"")+'>'+
      (best.indexOf(i)>=0?'<b class="bstar" title="One of the least-bad hours">&#9733;</b>':"")+lab+
      (i===nowCol?'<span class="nowpill'+edge+'" style="'+
        (edge?"":"left:"+nowPct+"%")+'">NOW</span>':"")+'</div>';
  });
  html+='</div></div>';

  // --- rows ---
  S.rows.forEach((tz,ri)=>{
    const isHome=tz===S.home;
    const now=wall(NOW,tz);                 // the clock stays live
    const off=offsetAt(REF,tz)-homeOff;     // the badge follows the grid
    const r24=uses24(tz);                   // per row, so MX can mix formats
    const timeStr=hhmm(now,r24);
    const abbr=abbrOf(REF,tz);

    html+='<div class="row'+(isHome?" home":"")+'">'+
      '<div class="lab">'+
        '<button class="star'+(isHome?" on":"")+'" data-home="'+tz+
          '" title="'+(isHome?"Home zone":"Set as home zone")+'">'+
