        '<div class="badge">'+(isHome?"0":offLabel(off))+'</div>'+
        '<div class="lmain">'+
          '<div class="znames"><div class="zname" data-home="'+tz+
            '" title="'+esc(cityOf(tz)+" \u2014 "+tz+" (click to set as home)")+'">'+
            cityOf(tz)+
            (abbr?'<span class="abbr">'+abbr+'</span>':"")+'</div>'+
            '<div class="zsub" title="'+esc(subOf(tz)+" \u2014 "+tz)+'">'+
            subOf(tz)+'</div></div>'+
          '<div class="tblock"><div class="ztime">'+timeStr+'</div>'+
            '<div class="zdate">'+now.wd+", "+titleMon(now.mo)+" "+now.d+'</div></div>'+
        '</div>'+
        '<div class="acts">'+
          '<button data-up="'+ri+'" title="Move up &middot; drag to reorder">&#9650;</button>'+
          '<button data-rm="'+ri+'" title="Remove">&times;</button>'+
        '</div>'+
        '<i class="lgrip" title="Drag to resize &middot; double-click to reset"></i>'+
      '</div>'+
      '<div class="cells" style="'+GT+'">';   // GT uses --cellmin, tightened on phones

    let prevDay=null,prevMo=null;
    cellData[ri].forEach((w,i)=>{
      const dayChanged=prevDay!==null&&w.d!==prevDay;
      const moChanged=prevMo!==null&&w.mo!==prevMo;
      prevDay=w.d; prevMo=w.mo;
      const cls=["c"];
      if(w.wd==="Sat"||w.wd==="Sun") cls.push("we");
      if(allBiz[i]) cls.push("allbiz");
      if(pinCols.has(i)) cls.push("pin");
      let inner=cellInner(w,r24);
      // the rollover marks the boundary rather than replacing the hour
      if(dayChanged) inner+='<i class="dayline"></i><span class="daypill'+
        (moChanged?" force-mo":"")+(i===N-1?" dp-right":"")+
        '"><span class="dp-wd">'+w.wd.toUpperCase()+
        ' </span><span class="dp-mo">'+MON[w.mo-1]+' </span>'+w.d+'</span>';
      html+='<div class="'+cls.join(" ")+'" data-col="'+i+'" style="background:'+
        hourColor(w.h,w.mi)+'">'+inner+'</div>';
    });
    html+='</div></div>';
  });

  html+='</div>';   // /.gwrap

  // --- pinned comparison, else the info line ---
  if(pinned!==null&&instants[pinned]!==undefined){
    const t0=instants[pinned]+pinMin*60000, t1=t0+pinLen*60000;
    const hw=wall(t0,S.home);
    pinSpan={t0:t0,t1:t1};
    const drift=driftNotes(t0,t1);
    const seg=(k,vals,cur,lab,tip)=>'<span class="pseg" data-k="'+k+'" title="'+tip+'">'+
      vals.map(v=>'<button'+(v===cur?' class="on"':"")+' data-v="'+v+'">'+lab(v)+
        '</button>').join("")+'</span>';
    // a meeting that runs into later days names both ends in the heading
    const hs=spillDays(t0,t1,S.home), he=wall(t1,S.home);
    html+='<div class="pinbar"><span class="plabel">Pinned &middot; '+
      hw.wd+" "+hw.d+(hs&&hw.mo===he.mo?"":" "+titleMon(hw.mo))+
      (hs?" &ndash; "+he.wd+" "+he.d+" "+titleMon(he.mo):"")+'</span>'+
      /* each label travels with its buttons, so a narrow bar wraps between
         the groups rather than stranding a label at the end of a line */
      '<span class="pinctl"><span class="pgrp"><em>start</em>'+
        seg("m",[0,15,30,45],pinMin,v=>":"+pad(v),"Minutes past the pinned hour")+'</span>'+
        '<span class="pgrp"><em>stop</em>'+
        seg("s",[0,15,30,45],stopMin(),v=>":"+pad(v),"Minute the meeting ends on")+'</span>'+
        '<span class="pgrp"><em>length</em><span class="plen">'+
          '<button data-len="-60"'+(pinLen-60<LEN_MIN?" disabled":"")+
            ' title="End one hour earlier">&minus;1h</button>'+
          '<b>'+lenWords(pinLen)+'</b>'+
          '<button data-len="60"'+(pinLen+60>LEN_MAX?" disabled":"")+
            ' title="End one hour later">+1h</button></span></span>'+
        /* the whole meeting an hour either way -- on a phone, easier than
           landing a thumb on a 28 px column */
        '<span class="pgrp"><em>move</em><span class="plen pmove">'+
          '<button data-mv="-1"'+(pinned<=0?" disabled":"")+
            ' title="Whole meeting one hour earlier">&lsaquo; 1h</button>'+
          '<button data-mv="1"'+(pinned>=N-1?" disabled":"")+
            ' title="Whole meeting one hour later">1h &rsaquo;</button></span></span></span>'+
      '<span class="spacer"></span>'+
      '<span class="pinlegend"><em><i style="background:var(--biz)"></i>9&ndash;5</em>'+
      '<em><i style="background:#e0a340"></i>fringe</em>'+
      '<em><i style="background:#93a4b8"></i>off hours</em></span>'+
      '<span class="lk" id="unpin">Clear pin</span>'+
      '<div class="pinchips">'+S.rows.map(tz=>{
        const w=wall(t0,tz), e=wall(t1,tz), r24=uses24(tz), sp=spillDays(t0,t1,tz);
        // the whole meeting is tested, not just its first hour
        const band="w-"+workBand(w,pinLen);
        const we=w.wd==="Sat"||w.wd==="Sun";
        // the date is stated once on the bar; only call out rows that differ
        const sameDay=w.y===hw.y&&w.mo===hw.mo&&w.d===hw.d;
        return '<span class="pinchip '+(we?"w-off":band)+'" style="background:'+
          hourColor(w.h,w.mi)+'"><b>'+cityOf(tz)+'</b> '+hhmm(w,r24)+"&ndash;"+hhmm(e,r24)+
          (sp?'<sup class="dplus" title="Ends '+shortDate(e)+'">+'+sp+'d</sup>':"")+
          (sameDay?"":' <span>'+w.wd+" "+w.d+'</span>')+
          (we?'<span class="webadge">WEEKEND</span>':"")+'</span>';
      }).join("")+'</div>'+
      (drift.length?'<div class="drift" title="A clock change during this meeting, or in the three days before or after it">'+
        drift.slice(0,3).map(x=>'<div>&#9888; '+esc(x)+'</div>').join("")+
        (drift.length>3?'<div>&hellip; and '+(drift.length-3)+' more</div>':"")+'</div>':"")+
      '<div class="pinsent"><span id="psText">'+pinSentence(t0,t1)+'</span>'+
        '<div class="pinbtns"><button class="ui" id="psCopy">Copy sentence</button>'+
        '<button class="ui" id="psIcs" title="Download a calendar file for this meeting">Add to calendar</button>'+
        (canShare()?'<button class="ui" id="psShare">Share</button>':"")+'</div>'+
      '</div></div>';
  }else{
    const dayNote=len===24?"":(" &middot; <b>"+len+"-hour day</b> here (DST transition)");
    pinSpan=null;
    html+='<footer>'+(best.length?'<span class="bestline">No hour has everyone in 9&ndash;5 &middot; least bad: '+
      best.map(i=>'<a class="lk" data-best="'+i+'">&#9733;'+rulerLab[i]+'</a>').join(" ")+'</span>':"")+
      '<span>'+N+' hours from '+
      new Date(anchor).toISOString().replace(".000Z","Z")+dayNote+'</span>'+
      '<span>Green underline = every zone in working hours (Mon&ndash;Fri 9&ndash;5)</span>'+
      '<span>Hatched = weekend</span>'+
      '<span>'+(touchMode?"Tap any column to pin a meeting"
        :"Click a column to pin a meeting, or drag across several")+'</span>'+
      (touchMode?"":'<span class="kbd" title="Keyboard shortcuts">'+
        '&larr; &rarr; pin &middot; [ ] day &middot; T today &middot; / search &middot; '+
        'C copy &middot; Esc clear</span>')+'</footer>';
  }

  app.innerHTML=html;
  wire();
  refocus(app,fk);
  if(calOn) placeCal();                 // the badge was rebuilt; keep the calendar under it
}

/* Draw the pinned column as a single rounded outline spanning the ruler and
   every row. Measured from the DOM rather than computed from column widths,
   so it stays correct at any width and through horizontal scrolling. */
/* Touch screens fire mouseenter on a tap but never mouseleave, which strands
   the hover outline on the last column tapped. Detected from actual use
   rather than a (hover: hover) media query -- some embedders report
   "hover: none" on a perfectly ordinary desktop, which would silently kill
   hover there. A mouse never fires touchstart; a finger always does, and on
   a hybrid the most recent input wins. */
let hovCol=null, touchMode=false, gridScrollLeft=0, scrollKey="", dragged=false;
/* Desktop shortcut for a meeting length: press on a column and drag across.
   Mouse only -- on a touchscreen that gesture is a scroll. A plain click is
   left to the cell's own click handler, so pinning works exactly as before.
   Listened for on the document so a release outside the grid still ends it. */
let selDrag=null;
function colAt(x,y){
  const el=document.elementFromPoint(x,y), c=el&&el.closest&&el.closest(".c,.hc");
  return c&&c.dataset.col!==undefined?+c.dataset.col:null;
}
document.addEventListener("pointermove",function(e){
  if(!selDrag) return;
  const c=colAt(e.clientX,e.clientY); if(c===null) return;
  // anchored where the drag began, in either direction; the grid (one day)
  // is the practical limit, the ceiling only a formality
  const cap=Math.floor(LEN_MAX/60)-1;
  const a=c<selDrag.s?Math.max(c,selDrag.s-cap):selDrag.s;
  const b=c<selDrag.s?selDrag.s:Math.min(c,selDrag.s+cap);
  if(a!==selDrag.a||b!==selDrag.b){ selDrag.a=a; selDrag.b=b; placeOverlays(); }
});
/* ---------- keyboard ----------
   Left/Right move the pin (or pin the current hour), [ ] step a day, T today,
   / search, C copy the sentence, Esc clear the pin. Never while typing, and
   never with a modifier, so Ctrl+C, Cmd+[ and the rest keep their meaning. */
let lastN=0, lastNowCol=-1;                // written by render()
/* Bring the pinned meeting into view. "center" puts it mid-grid -- a link
   just opened; "min" scrolls only as far as needed -- the pin was nudged. A
   meeting wider than the view starts at its left edge. The sticky label
   covers the left of the scroller, so "visible" starts at its right edge. */
function revealPin(mode){
  const gw=document.querySelector(".gwrap");
  const lab=gw&&gw.querySelector(".row.hdr .lab"),
        h=gw&&gw.querySelector('.hc[data-col="'+pinned+'"]'), z=gw&&gw.querySelector(".hc:last-child");
  if(pinned===null||!lab||!h||!z) return;
  const g=gw.getBoundingClientRect(), a=h.getBoundingClientRect(), zr=z.getBoundingClientRect();
  const L=g.left+lab.getBoundingClientRect().width, R=g.right, m=8;
  const x0=a.left+a.width*pinMin/60, x1=Math.min(x0+a.width*pinLen/60,zr.right),
        wide=x1-x0>R-L-2*m;
  let d=0;
  if(mode==="center") d=wide?x0-L-m:(x0+x1)/2-(L+R)/2;
  else if(wide){ if(x0<L+m||x0>R-m) d=x0-L-m; }
  else if(x0<L+m) d=x0-L-m;
  else if(x1>R-m) d=x1-R+m;
  if(!d) return;
  let x=gw.scrollLeft+d;
  if(mode==="center"&&a.width>0) x=Math.round(x/a.width)*a.width;   // land on a column edge
  gw.scrollLeft=Math.max(0,x);
  gridScrollLeft=gw.scrollLeft; placeOverlays();
}
document.addEventListener("keydown",function(e){
  const app=document.getElementById("app");          // absent in self-test mode
  if(e.ctrlKey||e.metaKey||e.altKey||!S||!app||!app.firstChild) return;
  const t=e.target, tag=t&&t.tagName;
  /* While the week calendar is open it owns the keyboard: its own handler
     does the arrows, and a shortcut here would change the view behind it. */
  if(calOn){ if(e.key==="Escape"){ e.preventDefault(); closeCal(true); } return; }
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable)) return;
  const k=e.key;
  if((k==="ArrowLeft"||k==="ArrowRight")&&lastN>0){
    e.preventDefault();
    if(pinned===null) pinned=lastNowCol>=0?lastNowCol:Math.min(9,lastN-1);
    else pinned=Math.max(0,Math.min(lastN-1,pinned+(k==="ArrowLeft"?-1:1)));
    saveState(); render(); revealPin("min");
  }else if(k==="["||k==="]"){
    S.date=addDays(S.date,k==="["?-1:1); pinned=null; saveState(); render();
  }else if(k==="t"||k==="T"){
    S.date=todayIn(S.home); pinned=null; scrollKey=""; saveState(); render();
  }else if(k==="/"){
    const q=document.getElementById("q"); if(q){ e.preventDefault(); q.focus(); }
  }else if((k==="c"||k==="C")&&pinned!==null){
    const b=document.getElementById("psCopy"); if(b) b.click();
  }else if(k==="Escape"&&pinned!==null){
    pinned=null; saveState(); render();
  }
});

/* ---------- undo ----------
   Removing a row is one tap -- on a phone an easy mis-tap -- so it can be
   taken back for a few seconds. The toast lives outside #app so a re-render
   (the clock refreshes every 30 s) cannot wipe it mid-countdown. */
let undoSnap=null, undoTimer=0;
function hideUndo(){
  const t=document.getElementById("toast"); if(t) t.classList.remove("show");
  undoSnap=null;
}
/* The whole state, so one Undo serves every action that can lose work:
   removing a row, Reset, changing the home zone. */
function snapState(){
  return {S:JSON.parse(JSON.stringify(S)),pinned:pinned,pinMin:pinMin,pinLen:pinLen};
}
function showUndo(msg,snap){
  undoSnap=snap;
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast";
          t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML='<span>'+esc(msg)+'</span><button class="tbtn" id="undoBtn">Undo</button>';
  t.classList.add("show");
  document.getElementById("undoBtn").onclick=function(){
    const u=undoSnap; if(!u) return;
    S=u.S; pinned=u.pinned; pinMin=u.pinMin; pinLen=u.pinLen;
    hideUndo(); saveState(); render();
  };
  clearTimeout(undoTimer); undoTimer=setTimeout(hideUndo,6000);
}
/* ---------- week calendar ----------
   The W badge opens a month calendar with ISO week numbers down the side. A
   week number jumps to that week on the same weekday -- a Friday stays a
   Friday -- and a day goes straight to that day. It lives in <body>, like the
   undo toast, so the 30-second refresh cannot close it under the pointer.
   Keyboard: arrows move by day (by week in the week column), Page Up/Down by
   month and with Shift by year, Home/End to the week's ends, Enter picks,
   Esc closes. Tab steps through it as if it sat right after the badge. */
const MONL=["January","February","March","April","May","June","July","August",
            "September","October","November","December"];
const WDL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const CAL_MIN=1900*12, CAL_MAX=2200*12+11;          // validDate's range, in months
function dow1(dt){ return (new Date(Date.UTC(dt.y,dt.mo-1,dt.d)).getUTCDay()+6)%7; }  // Mon 0..Sun 6
function mondayOf(dt){ return addDays(dt,-dow1(dt)); }
const eqDate=(a,b)=>a.y===b.y&&a.mo===b.mo&&a.d===b.d;
const dkey=d=>d.y+"-"+d.mo+"-"+d.d;
function dparse(k){ const p=k.split("-"); return {y:+p[0],mo:+p[1],d:+p[2]}; }
/* The ISO weeks a month touches, four to six of them, as each one's Monday. */
function calWeeks(y,mo){
  const out=[];
  for(let m=mondayOf({y:y,mo:mo,d:1});m.y*12+m.mo<=y*12+mo;m=addDays(m,7)) out.push(m);
  return out;
}
/* Jumping to a week keeps the weekday you were looking at. */
function sameWeekday(from,mon){ return addDays(mon,dow1(from)); }
/* "Week 39: 21-27 Sep"; the ISO year is named when it is not the calendar's,
   as for the week 53 that opens January 2027. */
function weekTitle(mon,y){
  const su=addDays(mon,6), w=isoWeek(mon.y,mon.mo,mon.d);
  return "Week "+w.w+(w.y!==y?" of "+w.y:"")+": "+
    (mon.mo===su.mo?mon.d:mon.d+" "+titleMon(mon.mo))+"\u2013"+su.d+" "+titleMon(su.mo);
}
/* One tab stop among the days and one among the week numbers (roving
   tabindex), both on `foc`, the day the keyboard is on. */
function calHTML(y,mo,sel,today,foc){
  const at=y*12+mo-1, selMon=mondayOf(sel), focMon=mondayOf(foc);
  let h='<div class="calhd">'+
    '<button class="calnav" data-cm="-1" aria-label="Previous month"'+
      (at<=CAL_MIN?" disabled":"")+'>&#8249;</button>'+
    '<span class="calttl" aria-live="polite">'+MONL[mo-1]+" "+y+'</span>'+
    '<button class="calnav" data-cm="1" aria-label="Next month"'+
      (at>=CAL_MAX?" disabled":"")+'>&#8250;</button></div>'+
    '<div class="calrow calh"><span title="ISO week">wk</span>'+
    ["Mo","Tu","We","Th","Fr","Sa","Su"].map((d,i)=>'<span'+(i>4?' class="we"':"")+'>'+d+'</span>').join("")+
    '</div>';
  for(const mon of calWeeks(y,mo)){
    const land=sameWeekday(sel,mon), t=weekTitle(mon,y);
    h+='<div class="calrow'+(eqDate(mon,selMon)?" cur":"")+'">'+
      '<button class="calwk" data-cw="'+dkey(mon)+'" tabindex="'+(eqDate(mon,focMon)?0:-1)+'"'+
        (validDate(land.y,land.mo,land.d)?"":" disabled")+' title="'+t+'" aria-label="'+t+'">'+
        isoWeek(mon.y,mon.mo,mon.d).w+'</button>';
    for(let i=0;i<7;i++){
      const d=addDays(mon,i), on=eqDate(d,sel), td=eqDate(d,today);
      h+='<button class="cald'+(d.mo!==mo?" out":"")+(i>4?" we":"")+(on?" sel":"")+(td?" tdy":"")+'"'+
        ' data-cd="'+dkey(d)+'" tabindex="'+(eqDate(d,foc)?0:-1)+'"'+
        (validDate(d.y,d.mo,d.d)?"":" disabled")+
        ' aria-label="'+WDL[i]+" "+d.d+" "+MONL[d.mo-1]+" "+d.y+(on?", shown":"")+(td?", today":"")+'">'+
        d.d+'</button>';
    }
    h+='</div>';
  }
  return h+'<div class="calft">'+(touchMode?"Tap":"Click")+' a week number to jump to that week</div>';
}
let calOn=false, calY=2026, calMo=1, calFoc={y:2026,mo:1,d:1};
/* Move the calendar by months, keeping the keyboard's day number where the
   new month has it (31 Jan -> 28 Feb). */
function calShift(n){
  const at=Math.max(CAL_MIN,Math.min(CAL_MAX,calY*12+calMo-1+n));
  calY=Math.floor(at/12); calMo=at%12+1;
  const last=new Date(Date.UTC(calY,calMo,0)).getUTCDate();
  calFoc={y:calY,mo:calMo,d:Math.min(calFoc.d,last)};
}
function placeCal(){
  const c=document.getElementById("cal"), b=document.getElementById("wk");
  if(!c||!b) return;
  const r=b.getBoundingClientRect(), vw=document.documentElement.clientWidth;
  c.style.left=(Math.max(8,Math.min(r.left,vw-8-c.offsetWidth))+window.scrollX)+"px";
  c.style.top=(r.bottom+6+window.scrollY)+"px";
}
function drawCal(focusSel){
  const c=document.getElementById("cal"); if(!c) return;
  c.innerHTML=calHTML(calY,calMo,S.date,todayIn(S.home),calFoc);
  placeCal();
  const f=focusSel&&c.querySelector(focusSel); if(f) f.focus();
}
function openCal(){
  if(calOn) return;
  calOn=true; calFoc={y:S.date.y,mo:S.date.mo,d:S.date.d}; calY=calFoc.y; calMo=calFoc.mo;
  const c=document.createElement("div"); c.id="cal"; c.className="cal";
  c.setAttribute("role","dialog"); c.setAttribute("aria-label","Week calendar");
  c.addEventListener("click",calClick);
  c.addEventListener("keydown",calKey);
  // a click on the title or padding must not drop focus out of the calendar
  c.addEventListener("mousedown",e=>{ if(!e.target.closest("button")) e.preventDefault(); });
  c.addEventListener("focusout",e=>{                  // focus moved elsewhere: close
    const t=e.relatedTarget;
    if(calOn&&t&&!c.contains(t)&&t.id!=="wk") closeCal(false);
  });
  document.body.appendChild(c);
  drawCal('[data-cd="'+dkey(calFoc)+'"]');
  const b=document.getElementById("wk"); if(b) b.setAttribute("aria-expanded","true");
}
function closeCal(refocus){
  if(!calOn) return;
  calOn=false;
  const c=document.getElementById("cal"); if(c) c.remove();
  const b=document.getElementById("wk");
  if(b){ b.setAttribute("aria-expanded","false"); if(refocus) b.focus(); }
}
function calClick(e){
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.dataset.cm){ calShift(+b.dataset.cm); drawCal('[data-cm="'+b.dataset.cm+'"]'); return; }
  const d=b.dataset.cd?dparse(b.dataset.cd)
         :b.dataset.cw?sameWeekday(S.date,dparse(b.dataset.cw)):null;
  if(!d||!validDate(d.y,d.mo,d.d)) return;
  const kb=e.detail===0;              // Enter or Space: hand focus back to the badge
  closeCal(false);
  S.date=d; pinned=null; saveState(); render();
  if(kb){ const w=document.getElementById("wk"); if(w) w.focus(); }
}
function calKey(e){
  const c=e.currentTarget, t=e.target, k=e.key;
  if(k==="Escape"){ e.preventDefault(); e.stopPropagation(); closeCal(true); return; }
  if(k==="Tab"){                      // out of the far end: on to the date box
    const f=[...c.querySelectorAll("button:not(:disabled)")].filter(b=>b.tabIndex>=0);
    if(e.shiftKey&&t===f[0]){ e.preventDefault(); closeCal(true); }
    else if(!e.shiftKey&&t===f[f.length-1]){
      e.preventDefault(); closeCal(false);
      const n=document.getElementById("dp")||document.getElementById("wk"); if(n) n.focus();
    }
    return;
  }
  const wk=!!(t.dataset&&t.dataset.cw);
  if(!wk&&!(t.dataset&&t.dataset.cd)) return;          // the month arrows: plain buttons
  const f=calFoc, step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[k];
  if(k==="PageUp"||k==="PageDown"){
    e.preventDefault(); e.stopPropagation();
    calShift((k==="PageUp"?-1:1)*(e.shiftKey?12:1));
    drawCal(wk?'[data-cw="'+dkey(mondayOf(calFoc))+'"]':'[data-cd="'+dkey(calFoc)+'"]');
    return;
  }
  let d=null;
  if(wk){ if(k==="ArrowUp"||k==="ArrowDown") d=addDays(f,step); }
  else if(step) d=addDays(f,step);
  else if(k==="Home") d=addDays(f,-dow1(f));
  else if(k==="End") d=addDays(f,6-dow1(f));
  if(!d) return;
  e.preventDefault(); e.stopPropagation();
  if(!validDate(d.y,d.mo,d.d)) return;
  calFoc=d;
  /* A day shows its own month. A week stays on this page while the page has
     it, and otherwise turns to the month of the day it lands on -- which
     always has that week. */
  const mon=mondayOf(d);
  if(wk?!calWeeks(calY,calMo).some(m=>eqDate(m,mon)):(d.y!==calY||d.mo!==calMo)){
    calY=d.y; calMo=d.mo;
  }
  drawCal(wk?'[data-cw="'+dkey(mon)+'"]':'[data-cd="'+dkey(d)+'"]');
}
/* A press anywhere else closes it. On a phone the calendar covers most of
   the screen, so the tap that dismisses it is not aimed at what lies
   underneath -- a zone name (which would become home), a row's remove, a
   column -- and it goes no further. A mouse click was aimed, and goes on. */
let calSwallow=0;
document.addEventListener("pointerdown",function(e){
  if(!calOn) return;
  const c=document.getElementById("cal"), b=document.getElementById("wk");
  if((c&&c.contains(e.target))||(b&&b.contains(e.target))) return;
  closeCal(false);
  if(e.pointerType==="touch"||e.pointerType==="pen") calSwallow=Date.now()+700;
},true);
document.addEventListener("click",function(e){
  if(calSwallow&&Date.now()<calSwallow){ e.stopPropagation(); e.preventDefault(); }
  calSwallow=0;
},true);
window.addEventListener("resize",function(){ if(calOn) placeCal(); });

/* Change the home zone without losing your place. A pinned meeting keeps its
   instant and length, re-expressed in the new home's day and columns -- the
   view changes, the meeting does not. With no pin, a view of today stays
   today, and any other date stays where it was. */
function rehome(nh){
  if(nh===S.home) return false;
  if(pinned!==null){
    const t0=zonedToInstant(S.date.y,S.date.mo,S.date.d,0,0,S.home).instant+
             pinned*3600000+pinMin*60000;
    const w=wall(t0,nh), a=zonedToInstant(w.y,w.mo,w.d,0,0,nh).instant,
          k=Math.round((t0-a)/60000);           // minutes past the new home's midnight
    S.date={y:w.y,mo:w.mo,d:w.d}; pinned=Math.floor(k/60); pinMin=k%60;
  }else{
    const t=todayIn(S.home);
    if(S.date.y===t.y&&S.date.mo===t.mo&&S.date.d===t.d) S.date=todayIn(nh);
  }
  S.home=nh;
  return true;
}

/* ---------- reorder by dragging ----------
   Desktop: drag the up-arrow, which still moves a row up one on a click.
   Touch: press and hold a row's label for 350 ms, then drag; a quick swipe
   stays a scroll. The moved row follows the pointer and a line marks where it
   will land. After a touch drag the finger lifts over whatever row is now
   there, and the browser would turn that into a tap -- setting a home zone or
   pinning a column nobody chose -- so the next click is swallowed. */
let reo=null, suppressTap=false;
function reoStart(ri,y){
  const rows=[...document.querySelectorAll(".row:not(.hdr)")];
  if(rows.length<2||!rows[ri]) return false;
  const line=document.createElement("div"); line.className="reoline";
  document.body.appendChild(line);
  rows[ri].classList.add("reo");
  reo={from:ri,to:ri,y0:y,rows:rows,rects:rows.map(r=>r.getBoundingClientRect()),line:line};
  reoMove(y);
  return true;
}
function reoMove(y){
  if(!reo) return;
  reo.rows[reo.from].style.transform="translateY("+(y-reo.y0)+"px)";
  let to=reo.rects.length;                 // the first row whose middle is below the pointer
  for(let i=0;i<reo.rects.length;i++){
    const r=reo.rects[i]; if(y<r.top+r.height/2){ to=i; break; }
  }
  reo.to=to;
  const g=document.querySelector(".gwrap").getBoundingClientRect(),
        edge=to<reo.rects.length?reo.rects[to].top:reo.rects[reo.rects.length-1].bottom;
  reo.line.style.cssText="top:"+(edge-1)+"px;left:"+g.left+"px;width:"+g.width+"px";
}
function reoEnd(commit){
  if(!reo) return;
  const r=reo; reo=null;
  r.line.remove(); r.rows[r.from].classList.remove("reo"); r.rows[r.from].style.transform="";
  if(!commit) return;
  let to=r.to; if(to>r.from) to--;         // lifting the row out shifts every slot below it
  if(to===r.from) return;
  S.rows.splice(to,0,S.rows.splice(r.from,1)[0]);
  saveState(); render();
}
document.addEventListener("click",function(e){
  if(suppressTap){ suppressTap=false; e.stopPropagation(); e.preventDefault(); }
},true);

document.addEventListener("pointerup",function(){
  if(!selDrag) return;
  const d=selDrag; selDrag=null;
  if(d.b>d.a){ pinned=d.a; pinMin=0; pinLen=(d.b-d.a+1)*60; saveState(); render(); }
  else placeOverlays();
});

/* Every render rebuilds .gwrap, which resets its scrollLeft to 0 -- so the
   30-second clock refresh used to throw away the user's scroll position.
   Restore it, and when the view genuinely changes (zone, date, rows) land on
   the hours that matter rather than on local midnight. Matters most on a
   phone, where only a handful of columns are visible at once. */
/* Phones only: size the label to the widest zone actually on screen instead
   of a fixed guess, so "Berlin / Tokyo / Cairo" gives the grid ~20px more
   than "New York / Los Angeles" would. Floored so it never gets too cramped
   to read, capped so one long name cannot swallow the grid. */
function fitLabel(){
  const root=document.documentElement;
  if(innerWidth>560){ root.style.removeProperty("--labw"); return; }
  const labs=document.querySelectorAll(".row:not(.hdr) .lab");
  if(!labs.length) return;
  /* Measure the text off-layout with canvas. Anything measured from the DOM
     is circular here: scrollWidth returns the laid-out box when the text is
     shorter, and a Range is clamped by the element's own clipped box -- both
     just hand back the width set on the previous pass, so the label can only
     creep toward the right answer instead of landing on it. */
  const ctx=fitLabel.ctx||(fitLabel.ctx=document.createElement("canvas").getContext("2d"));
  const textW=function(el,txt){
    if(!el||!txt) return 0;
    const cs=getComputedStyle(el);
    ctx.font=cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
    return ctx.measureText(txt).width;
  };
  let need=0;
  labs.forEach(function(l){
    const n=l.querySelector(".zname"), b=l.querySelector(".badge"),
          t=l.querySelector(".ztime");
    // first child node only: skips the abbreviation span, hidden at this size
    const city=n&&n.firstChild?n.firstChild.textContent:"";
    need=Math.max(need,textW(n,city),
      textW(b,b&&b.textContent)+4+textW(t,t&&t.textContent));
  });
  const chrome=7+4+24+3;           // padding + gap + remove button + padding
  root.style.setProperty("--labw",
    Math.max(96,Math.min(150,Math.ceil(need)+chrome))+"px");
}

/* ---------- resizable frozen column ----------
   The width lives on :root, so it survives render() replacing the grid and
   only has to be restored once at boot. Below 560px fitLabel() owns the width
   instead and the grip is hidden, so the two never both write --labwd. */
const LABW="wtb.labw", LABW_MIN=200, LABW_MAX=640;
let labDragging=false;
function applyLabW(){
  let v=null;
  try{ v=localStorage.getItem(LABW); }catch(e){}
  const w=parseInt(v,10);
  if(w>=LABW_MIN&&w<=LABW_MAX)
    document.documentElement.style.setProperty("--labwd",w+"px");
  else
    document.documentElement.style.removeProperty("--labwd");
}
function clampLabW(w){ return Math.max(LABW_MIN,Math.min(LABW_MAX,Math.round(w))); }
function wireGrips(){
  const gw=document.querySelector(".gwrap"); if(!gw) return;
  const root=document.documentElement;
  gw.querySelectorAll(".lgrip").forEach(function(g){
    g.addEventListener("mouseenter",function(){ gw.classList.add("gripping"); });
    g.addEventListener("mouseleave",function(){
      if(!labDragging) gw.classList.remove("gripping"); });
    g.addEventListener("pointerdown",function(e){
      e.preventDefault(); e.stopPropagation();   // not a click on the row beneath
      const w0=g.parentNode.getBoundingClientRect().width, x0=e.clientX;
      let raf=0;
      labDragging=true; gw.classList.add("gripping");
      try{ g.setPointerCapture(e.pointerId); }catch(err){}
      const move=function(ev){
        root.style.setProperty("--labwd",clampLabW(w0+ev.clientX-x0)+"px");
        // overlays are positioned from measured rects, so they must follow
        if(!raf) raf=requestAnimationFrame(function(){ raf=0; placeOverlays(); });
      };
      const up=function(){
        labDragging=false; gw.classList.remove("gripping");
        g.removeEventListener("pointermove",move);
        g.removeEventListener("pointerup",up);
        g.removeEventListener("pointercancel",up);
        try{ localStorage.setItem(LABW,
               parseInt(root.style.getPropertyValue("--labwd"),10)); }catch(err){}
        placeOverlays();
      };
      g.addEventListener("pointermove",move);
      g.addEventListener("pointerup",up);
      g.addEventListener("pointercancel",up);
    });
    g.addEventListener("dblclick",function(e){
      e.preventDefault(); e.stopPropagation();
      root.style.removeProperty("--labwd");
      try{ localStorage.removeItem(LABW); }catch(err){}
      placeOverlays();
    });
  });
}

function syncGridScroll(){
  const gw=document.querySelector(".gwrap"); if(!gw) return;
  const key=S.home+"|"+S.date.y+"-"+S.date.mo+"-"+S.date.d+"|"+S.rows.join(",");
  if(key===scrollKey){ gw.scrollLeft=gridScrollLeft; return; }
  scrollKey=key;
  /* A pinned meeting is what the view is about: a shared link has to open on
     it, not on 9 AM with the meeting off to the side. Otherwise now, or 9 AM. */
  if(pinned!==null){ gw.scrollLeft=0; revealPin("center"); gridScrollLeft=gw.scrollLeft; return; }
  const t=gw.querySelector(".hc.iscur")||gw.querySelector('.hc[data-col="9"]');
  if(t){
    const g=gw.getBoundingClientRect(), r=t.getBoundingClientRect();
    let x=Math.max(0,gw.scrollLeft+(r.left-g.left)-(gw.clientWidth-r.width)/2);
    // land on a column boundary: a grid sliced mid-cell looks unfinished
    if(r.width>0) x=Math.round(x/r.width)*r.width;
    gw.scrollLeft=x;
  }
  gridScrollLeft=gw.scrollLeft;
}
document.addEventListener("touchstart",function(){ touchMode=true; },{passive:true});
/* Column-spanning marks are drawn as single overlays rather than per-cell
   borders, which the row rules would otherwise chop into segments.
   Measured from the DOM so they stay exact at any width and while scrolling.
   Everything is inset, never overhanging: a 1px overhang was once enough to
   push the page past the vertical-scrollbar threshold, and since #app is
   centred, gaining that scrollbar shifted the grid out from under the box. */
function placeOverlays(){
  const gw=document.querySelector(".gwrap");
  if(!gw) return;
  gw.querySelectorAll(".pinbox,.nowbar,.hoverbox,.selbox").forEach(e=>e.remove());
  const rows=gw.querySelectorAll(".row:not(.hdr)");
  if(!rows.length) return;
  const g=gw.getBoundingClientRect();
  const X=r=>r.left-g.left+gw.scrollLeft, Y=r=>r.top-g.top+gw.scrollTop;
  const first=rows[0].getBoundingClientRect(),
        last=rows[rows.length-1].getBoundingClientRect();

  const colBox=(cls,col)=>{
    const head=gw.querySelector('.hc[data-col="'+col+'"]');
    const cells=gw.querySelectorAll('.c[data-col="'+col+'"]');
    if(!head||!cells.length) return;
    const a=head.getBoundingClientRect(),
          b=cells[cells.length-1].getBoundingClientRect();
    const d=document.createElement("div");
    d.className=cls;
    d.style.left=X(a)+"px"; d.style.top=Y(a)+"px";
    d.style.width=a.width+"px"; d.style.height=(b.bottom-a.top)+"px";
    gw.appendChild(d);
  };
  /* A meeting box starts part-way into its column and may span several.
     Columns are exact UTC hours, even on DST days, so minutes map to width
     linearly. Clamped at the grid's right edge: never overhang (see above). */
  const spanBox=(cls,col,startMin,lenMin)=>{
    const head=gw.querySelector('.hc[data-col="'+col+'"]');
    const cells=gw.querySelectorAll('.c[data-col="'+col+'"]');
    const end=gw.querySelector(".hc:last-child");
    if(!head||!cells.length||!end) return;
    const a=head.getBoundingClientRect(), b=cells[cells.length-1].getBoundingClientRect(),
          z=end.getBoundingClientRect();
    const x0=X(a)+a.width*startMin/60, full=x0+a.width*lenMin/60, x1=Math.min(full,X(z)+z.width);
    const d=document.createElement("div");
    // runs on past the displayed day: leave the right side open
    d.className=cls+(full>X(z)+z.width+0.5?" cont":"");
    d.style.left=x0+"px"; d.style.top=Y(a)+"px";
    d.style.width=Math.max(4,x1-x0)+"px"; d.style.height=(b.bottom-a.top)+"px";
    gw.appendChild(d);
  };
  if(pinned!==null) spanBox("pinbox",pinned,pinMin,pinLen);
  if(selDrag&&selDrag.b>selDrag.a) spanBox("selbox",selDrag.a,0,(selDrag.b-selDrag.a+1)*60);
  else if(hovCol!==null&&hovCol!==pinned) colBox("hoverbox",hovCol);

  /* day-pill detail follows the measured cell width, so it also shrinks when
     a DST day adds a 25th column rather than only when the window narrows */
  const cw=(gw.querySelector(".hc")||{getBoundingClientRect:()=>({width:0})})
             .getBoundingClientRect().width;
  gw.classList.toggle("lbl-full",cw>=34);   // 34 = the grid's track minimum
  gw.classList.toggle("scrolls",gw.scrollWidth>gw.clientWidth+1);

  /* the now bar hangs off the bottom of the NOW pill rather than starting at
     the first row, so the marker reads as one continuous object */
  const cur=gw.querySelector(".hc.iscur");
  if(cur&&cur.dataset.nowpct!==undefined){
    const c=cur.getBoundingClientRect();
    const pill=cur.querySelector(".nowpill");
    const topY=pill?Y(pill.getBoundingClientRect())+pill.getBoundingClientRect().height
                   :Y(first);
    const bar=document.createElement("div");
    bar.className="nowbar";
    bar.style.left=(X(c)+c.width*(parseFloat(cur.dataset.nowpct)/100)-1)+"px";
    bar.style.top=topY+"px";
    bar.style.height=(last.bottom-g.top-gw.scrollTop-topY)+"px";
    gw.appendChild(bar);
  }
}
window.addEventListener("resize",placeOverlays);

/* ============================================================
   EVENTS
   ============================================================ */
function wire(){
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  let gw2;

  $$(".day").forEach(el=>el.onclick=()=>{
    const p=el.dataset.d.split("-");
    S.date={y:+p[0],mo:+p[1],d:+p[2]}; pinned=null; saveState(); render();
  });
  const dp=$("#dp"); if(dp) dp.onchange=()=>{
    const p=dp.value.split("-");
    if(p.length===3&&p[0]){ S.date={y:+p[0],mo:+p[1],d:+p[2]}; pinned=null; saveState(); render(); }
  };
  $$("[data-fmt]").forEach(b=>b.onclick=()=>{
    S.fmt=b.dataset.fmt; saveState(); render();
  });
  $("#copy").onclick=()=>{
    // phones: the native share sheet; a cancelled sheet is not an error
    if(canShare()){
      navigator.share({title:document.title,url:location.href}).catch(()=>{});
      return;
    }
    const btn=$("#copy"), keep=btn.innerHTML;   // holds the full/min label spans
    const done=t=>{ btn.textContent=t; setTimeout(()=>{btn.innerHTML=keep;},1400); };
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(location.href).then(()=>done("Copied!"),()=>done("See address bar"));
    }else{ done("See address bar"); }
  };
  const rs=$("#reset"); if(rs) rs.onclick=()=>{
    const snap=snapState();                  // one tap wipes every zone: keep a way back
    try{localStorage.removeItem(LS);}catch(e){}
    history.replaceState(null,"","#");
    pinned=null; S=defaultState(); saveState(); render();
    showUndo("Reset to defaults",snap);
  };
  // Today also re-centres on now, even when today is already showing
  const wkb=$("#wk"); if(wkb) wkb.onclick=()=>{ if(calOn) closeCal(true); else openCal(); };
  const tb=$("#todaybtn"); if(tb) tb.onclick=()=>{
    S.date=todayIn(S.home); pinned=null; scrollKey=""; saveState(); render();
  };
  const step=n=>()=>{ S.date=addDays(S.date,n); pinned=null; saveState(); render(); };
  const dpv=$("#dprev"); if(dpv) dpv.onclick=step(-1);
  const dnx=$("#dnext"); if(dnx) dnx.onclick=step(1);
  const up=$("#unpin"); if(up) up.onclick=()=>{ pinned=null; saveState(); render(); };
  const ics=$("#psIcs"); if(ics) ics.onclick=()=>{
    if(!pinSpan) return;
    const w=wall(pinSpan.t0,S.home);
    downloadIcs(icsText(pinSpan.t0,pinSpan.t1,"Meeting",$("#psText").textContent,location.href),
      "meeting-"+w.y+"-"+pad(w.mo)+"-"+pad(w.d)+"-"+pad(w.h)+pad(w.mi)+".ics");
  };
  const shr=$("#psShare"); if(shr) shr.onclick=()=>{
    navigator.share({title:"Meeting time",text:$("#psText").textContent,
                     url:location.href}).catch(()=>{});
  };
  $$("[data-best]").forEach(a=>a.onclick=()=>{
    pinned=+a.dataset.best; saveState(); render(); revealPin("min");
  });
  // (the pinned bar's move buttons: the phone's stand-in for the arrow keys)
  $$("[data-mv]").forEach(b=>b.onclick=()=>{
    pinned=Math.max(0,Math.min(lastN-1,pinned+ +b.dataset.mv));
    saveState(); render(); revealPin("min");
  });
  $$(".pseg button").forEach(b=>b.onclick=()=>{
    if(b.parentNode.dataset.k==="m") setStart(+b.dataset.v); else setStop(+b.dataset.v);
    saveState(); render();
  });
  // by attribute, not by .plen: the move buttons share that look, and a
  // selector on the class quietly took their clicks over
  $$("[data-len]").forEach(b=>b.onclick=()=>{
    nudgeLen(+b.dataset.len); saveState(); render();
  });
  const pc=$("#psCopy"); if(pc) pc.onclick=()=>{
    const txt=$("#psText").textContent, keep=pc.textContent;
    const done=t=>{ pc.textContent=t; setTimeout(()=>{pc.textContent=keep;},1400); };
    if(navigator.clipboard&&window.isSecureContext)
      navigator.clipboard.writeText(txt).then(()=>done("Copied!"),()=>selectSentence());
    else selectSentence();
    // file:// has no clipboard API, so fall back to selecting it for Ctrl+C
    function selectSentence(){
      const r=document.createRange(); r.selectNodeContents($("#psText"));
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected");
    }
  };

  $$("[data-rm]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.rm, gone=S.rows[i];
    const snap=snapState();
    S.rows.splice(i,1);
    if(gone===S.home&&S.rows.length){ S.home=S.rows[0]; S.date=todayIn(S.home); }
    saveState(); render();
    showUndo("Removed "+cityOf(gone),snap);
  });
  $$("[data-up]").forEach(b=>{
    b.onpointerdown=e=>{
      if(e.pointerType!=="mouse"||e.button!==0) return;
      e.preventDefault();                  // no text selection trailing the drag
      const ri=+b.dataset.up, y0=e.clientY;
      let on=false;
      const mv=ev=>{
        if(!on&&Math.abs(ev.clientY-y0)>4) on=reoStart(ri,y0);
        if(on) reoMove(ev.clientY);
      };
      const upH=()=>{
        document.removeEventListener("pointermove",mv);
        document.removeEventListener("pointerup",upH);
        if(on){ b.dataset.dragged="1"; setTimeout(()=>{ delete b.dataset.dragged; },0); reoEnd(true); }
      };
      document.addEventListener("pointermove",mv);
      document.addEventListener("pointerup",upH);
    };
    b.onclick=()=>{
      if(b.dataset.dragged) return;        // that was a drag, not a click
      const i=+b.dataset.up; if(i===0) return;
      const t=S.rows[i-1]; S.rows[i-1]=S.rows[i]; S.rows[i]=t;
      saveState(); render();
    };
  });
  // touch: long-press a row label, then drag
  $$(".row:not(.hdr) .lab").forEach((lab,ri)=>{
    let timer=0, x0=0, y0=0, armed=false;
    lab.addEventListener("touchstart",e=>{
      if(e.touches.length!==1||e.target.closest("button,.lgrip")) return;
      x0=e.touches[0].clientX; y0=e.touches[0].clientY; armed=false;
      clearTimeout(timer);
      timer=setTimeout(()=>{
        armed=reoStart(ri,y0);
        if(armed&&navigator.vibrate) navigator.vibrate(12);
      },350);
    },{passive:true});
    lab.addEventListener("touchmove",e=>{
      const t=e.touches[0];
      if(!armed){                            // moved before the hold: it is a scroll
        if(Math.abs(t.clientX-x0)>8||Math.abs(t.clientY-y0)>8) clearTimeout(timer);
        return;
      }
      e.preventDefault(); reoMove(t.clientY);
    },{passive:false});
    const end=e=>{
      clearTimeout(timer);
      if(!armed) return;
      armed=false; suppressTap=true; setTimeout(()=>{ suppressTap=false; },600);
      reoEnd(e.type==="touchend");
    };
    lab.addEventListener("touchend",end);
    lab.addEventListener("touchcancel",end);
  });
  /* On phones the star is hidden and a tap on the name is the only way to
     set home, so it must not cost the pinned meeting or the date: rehome keeps
     both, a tap on the current home does nothing, and Undo covers the rest. */
  $$("[data-home]").forEach(el=>el.onclick=()=>{
    const nh=el.dataset.home, snap=snapState();
    if(!rehome(nh)) return;
    saveState(); render();
    showUndo("Home is now "+cityOf(nh),snap);
  });

  // crosshair: hover is class-only, pinning re-renders so the bar can update
  $$(".c").forEach(c=>{
    c.onmouseenter=()=>{
      if(touchMode) return;              // a tap, not a hovering pointer
      const i=c.dataset.col;
      $$('.c[data-col="'+i+'"],.hc[data-col="'+i+'"]').forEach(x=>x.classList.add("hov"));
      hovCol=+i; placeOverlays();
    };
    c.onmouseleave=()=>{                 // always clears, harmless if never set
      $$(".c.hov,.hc.hov").forEach(x=>x.classList.remove("hov"));
      hovCol=null; placeOverlays();
    };
    // clear hover on click too: a hybrid laptop reports hover:hover but a
    // tap on its touchscreen still never sends mouseleave
    c.onpointerdown=e=>{
      if(e.pointerType!=="mouse"||e.button!==0) return;
      const i=+c.dataset.col; selDrag={s:i,a:i,b:i};
    };
    c.onclick=()=>{
      if(dragged){ dragged=false; return; }   // that was a scroll, not a tap
      const i=+c.dataset.col; pinned=(pinned===i?null:i);
      hovCol=null; saveState(); render();
    };
  });

  // zone search
  const q=$("#q"), drop=$("#drop");
  let hi=-1, list=[];
  const close=()=>{ drop.classList.remove("open"); hi=-1; };
  const show=()=>{
    list=searchZones(q.value);
    if(!list.length){ close(); return; }
    const offQ=parseOffsetQuery(fold(q.value.trim()));
    drop.innerHTML=list.map((z,i)=>'<div data-i="'+i+'"><span class="off">'+
      offTagFor(z,offQ)+'</span>'+shortName(z[0])+
      (z[4]&&!/^GMT[+-]/.test(z[4])?'<span class="abbr">'+z[4]+'</span>':"")+
      '</div>').join("");
    drop.classList.add("open");
    [...drop.children].forEach(el=>el.onmousedown=e=>{ e.preventDefault(); pick(+el.dataset.i); });
  };
  /* Repaint when a deferred pass (abbreviations, country names) lands. Not
     only when open: a query typed or pasted before the pass matched nothing,
     which closed the list, and it has to reopen now that it does match. */
  onAbbrs=()=>{ if(drop.classList.contains("open")||
                   (document.activeElement===q&&q.value.trim())) show(); };

  /* Draw now, and again on the next task as a safety net. Not rAF alone:
     that is throttled while the page is not painting, which would leave the
     overlays missing entirely in a background tab. */
  gw2=$(".gwrap");
  if(gw2){
    gw2.onscroll=function(){ gridScrollLeft=gw2.scrollLeft; placeOverlays(); };
    /* A swipe to scroll the grid ends in a click on whatever cell the finger
       started on, which would pin a column the user never meant to choose.
       Remember whether the touch travelled, and let the click handler bail.
       .gwrap is rebuilt each render, so these never accumulate. */
    let sx=0;
    gw2.addEventListener("touchstart",function(e){
      sx=e.touches[0].clientX; dragged=false;
    },{passive:true});
    gw2.addEventListener("touchmove",function(e){
      if(Math.abs(e.touches[0].clientX-sx)>8) dragged=true;
    },{passive:true});
  }
  fitLabel();            // before the scroll maths: it changes the grid's width
  wireGrips();
  syncGridScroll();
  placeOverlays(); setTimeout(placeOverlays,0);
  const pick=i=>{
    const z=list[i]; if(!z) return;
    if(!S.rows.includes(z[1])) S.rows.push(z[1]);
    q.value=""; close(); saveState(); render();
  };
  q.oninput=show;
  q.onfocus=show;
  q.onblur=()=>setTimeout(close,150);
  q.onkeydown=e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      hi=Math.max(0,Math.min(list.length-1,hi+(e.key==="ArrowDown"?1:-1)));
      [...drop.children].forEach((el,i)=>el.classList.toggle("hi",i===hi));
      if(drop.children[hi]) drop.children[hi].scrollIntoView({block:"nearest"});
    }else if(e.key==="Enter"){ pick(hi<0?0:hi); }
    else if(e.key==="Escape"){ close(); q.blur(); }
  };
}

/* ============================================================
   BOOT
   ============================================================ */
if(location.search.indexOf("selftest")>=0){
  selftest();
}else{
  S=loadState();
  S.rows=[...new Set(S.rows)]          // a hand-edited hash can repeat a zone
    .filter(z=>{ try{ wall(Date.now(),z); return true; }catch(e){ return false; } });
  if(!S.rows.length) S=defaultState();
  if(!S.rows.includes(S.home)) S.home=S.rows[0];
  if(!S.date||!validDate(S.date.y,S.date.mo,S.date.d)) S.date=todayIn(S.home);
  // migrate the old boolean h24 flag to the three-way format setting
  if(!FMTS[S.fmt]) S.fmt=S.h24===true?"24":localFmt();
  delete S.h24;
  applyLabW();
  saveState(); render();
  // live clock refresh -- never while the user is typing a zone search,
  // since render() rebuilds the DOM and would eat the keystrokes
  setInterval(()=>{
    const q=document.getElementById("q");
    if(document.hasFocus()&&document.activeElement!==q) render();
  },30000);
  // the top-bar clock ticks on its own: one text node, no re-render
  setInterval(()=>{
    const el=document.getElementById("ncT");
    if(el) el.innerHTML=nowClockHTML();
  },1000);
}
</script>
</body>
</html>
